services:
  mastarr:
    depends_on:
      - sonarr
      - radarr
      - sabnzbd
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls323
    environment:
      PUID: '${MEDIA_UID:-99}'
      PGID: '${MEDIA_GID:-100}'
      TZ: '${TZ:-UTC}'
    volumes:
      - sonarr-config:/config
      - '${MEDIA_PATH:?Set MEDIA_PATH to your media and downloads parent directory}:/data'
    ports:
      - '${ENGINE_BIND:-127.0.0.1}:8989:8989'
    restart: unless-stopped
  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls314
    environment:
      PUID: '${MEDIA_UID:-99}'
      PGID: '${MEDIA_GID:-100}'
      TZ: '${TZ:-UTC}'
    volumes:
      - radarr-config:/config
      - '${MEDIA_PATH:?Set MEDIA_PATH to your media and downloads parent directory}:/data'
    ports:
      - '${ENGINE_BIND:-127.0.0.1}:7878:7878'
    restart: unless-stopped
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.2-ls271
    environment:
      PUID: '${MEDIA_UID:-99}'
      PGID: '${MEDIA_GID:-100}'
      TZ: '${TZ:-UTC}'
    volumes:
      - sabnzbd-config:/config
      - '${MEDIA_PATH:?Set MEDIA_PATH to your media and downloads parent directory}:/data'
    ports:
      - '${ENGINE_BIND:-127.0.0.1}:8080:8080'
    restart: unless-stopped
volumes:
  sonarr-config:
  radarr-config:
  sabnzbd-config:
