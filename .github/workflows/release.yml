name: Release Docker
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching package.json
        required: true
        default: '14.0.0'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
          cache: npm
      - id: release
        run: node scripts/release-check.mjs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - run: npm ci
      - run: npm run check && node scripts/privacy-check.mjs && npm audit --audit-level=moderate && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: docker build -t mastarr:release-test .
      - run: node scripts/docker-smoke.mjs mastarr:release-test
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/radly82/mastarr:${{ needs.verify.outputs.version }}
          provenance: true
          sbom: true
