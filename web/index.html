<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#101018" />
    <meta
      name="description"
      content="Your movies. Your series. One beautifully organized place. Mastarr is your private, self-hosted media control room."
    />
    <title>Mastarr — Your media, together</title>
    <link rel="icon" href="/assets/mark.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <link rel="stylesheet" href="/styles.css?v=2.0.3" />
    <script type="module" src="/app.mjs?v=2.0.3"></script>
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>
    <div id="root">
      <div class="initial-loading">
        <img src="/assets/mark.svg" width="48" height="48" alt="" /><span
          >Opening your control room</span
        ><span class="loader"></span>
      </div>
    </div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <dialog id="detail-dialog" class="detail-dialog" aria-label="Media details"></dialog>
    <dialog id="confirm-dialog" class="confirm-dialog" aria-label="Confirm action"></dialog>
    <noscript
      >Mastarr needs JavaScript to manage your media. Enable JavaScript and reload this
      page.</noscript
    >
  </body>
</html>
