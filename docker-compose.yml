services:
  mastarr:
    build: .
    image: mastarr:2.0.4
    container_name: mastarr
    ports:
      - '${MASTARR_BIND:-0.0.0.0}:${MASTARR_PORT:-8686}:8686'
    environment:
      CONFIG_DIR: /config
      PUID: '${MASTARR_UID:-99}'
      PGID: '${MASTARR_GID:-100}'
      SECURE_COOKIES: '${SECURE_COOKIES:-false}'
      PUBLIC_ORIGIN: '${PUBLIC_ORIGIN:-}'
      TZ: '${TZ:-UTC}'
    volumes:
      - '${MASTARR_CONFIG:-mastarr-config}:/config'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  mastarr-config:
